name: Package and publish Helm library

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Package channel; auto selects from the event and branch.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - alpha
          - beta
          - release
  pull_request:
    branches:
      - master
  merge_group:
    types:
      - checks_requested
  push:
    paths:
      - ffc-helm-library/**
      - tests/**
      - scripts/**
      - .github/workflows/publish.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: helm-library-publish
  cancel-in-progress: false

jobs:
  decide-build:
    name: Decide whether to build
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Check out pipeline scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide whether this event needs a chart build
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/decide-build.sh

  package-and-publish:
    name: Package and publish chart
    needs: decide-build
    runs-on: ubuntu-24.04
    steps:
      - name: No chart build required
        if: needs.decide-build.outputs.should_build != 'true'
        run: echo 'No chart or pipeline files require validation for this event.'

      - name: Check out chart source
        if: needs.decide-build.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify publisher token permissions
        if: needs.decide-build.outputs.should_build == 'true' && github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.FFC_HELM_REPOSITORY_TOKEN }}
          PUBLISHER_REPOSITORIES: DEFRA/ffc-helm-library DEFRA/ffc-helm-repository
        run: bash scripts/verify-publisher-token.sh

      - name: Set up Helm
        if: needs.decide-build.outputs.should_build == 'true'
        uses: azure/setup-helm@v4

      - name: Read and validate chart version
        if: needs.decide-build.outputs.should_build == 'true'
        id: chart
        env:
          CHART_DIRECTORY: ffc-helm-library
        run: bash scripts/validate-chart-version.sh

      - name: Select package channel
        if: needs.decide-build.outputs.should_build == 'true'
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_CHANNEL: ${{ inputs.channel || 'auto' }}
        run: bash scripts/select-package-channel.sh

      - name: Prepare chart version
        if: >-
          needs.decide-build.outputs.should_build == 'true' &&
          github.event_name != 'merge_group' &&
          github.ref_name != 'master'
        id: version
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHART_DIRECTORY: ffc-helm-library
          CURRENT_VERSION: ${{ steps.chart.outputs.version }}
          PUBLISH_ENABLED: ${{ vars.HELM_PUBLISH_ENABLED == 'true' }}
          GH_TOKEN: ${{ secrets.FFC_HELM_REPOSITORY_TOKEN }}
        run: bash scripts/prepare-chart-version.sh

      - name: Lint chart
        if: >-
          needs.decide-build.outputs.should_build == 'true' &&
          steps.version.outputs.changed != 'true'
        run: helm lint ffc-helm-library

      - name: Test chart with a consumer
        if: >-
          needs.decide-build.outputs.should_build == 'true' &&
          steps.version.outputs.changed != 'true'
        run: bash tests/test-chart.sh

      - name: Test chart versioning and pipeline scripts
        if: >-
          needs.decide-build.outputs.should_build == 'true' &&
          steps.version.outputs.changed != 'true'
        run: bash tests/test-pipeline.sh

      - name: Package chart
        if: >-
          needs.decide-build.outputs.should_build == 'true' &&
          github.event_name != 'merge_group' &&
          steps.version.outputs.changed != 'true'
        id: package
        env:
          CHART_DIRECTORY: ffc-helm-library
          CHART_VERSION: ${{ steps.version.outputs.version || steps.chart.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package-chart.sh

      - name: Publish chart and update index
        if: >-
          needs.decide-build.outputs.should_build == 'true' &&
          github.event_name != 'merge_group' &&
          steps.version.outputs.changed != 'true' &&
          vars.HELM_PUBLISH_ENABLED == 'true'
        env:
          CHART_FILE: ${{ steps.package.outputs.file }}
          CHART_NAME: ${{ steps.package.outputs.name }}
          CHART_REPOSITORY: DEFRA/ffc-helm-repository
          CHART_REPOSITORY_BRANCH: master
          CHART_REPOSITORY_URL: https://raw.githubusercontent.com/defra/ffc-helm-repository/master/
          CHART_VERSION: ${{ steps.package.outputs.version }}
          GH_TOKEN: ${{ secrets.FFC_HELM_REPOSITORY_TOKEN }}
        run: bash scripts/publish-chart.sh

      - name: Upload dry-run chart package
        if: >-
          needs.decide-build.outputs.should_build == 'true' &&
          github.event_name != 'merge_group' &&
          steps.version.outputs.changed != 'true' &&
          vars.HELM_PUBLISH_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  refresh-open-pull-requests:
    name: Refresh open chart pull requests
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'master' &&
      vars.HELM_PUBLISH_ENABLED == 'true'
    needs: package-and-publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pipeline scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Re-run chart pull requests against the new master
        env:
          GH_TOKEN: ${{ secrets.FFC_HELM_REPOSITORY_TOKEN }}
        run: bash scripts/refresh-open-pull-requests.sh
